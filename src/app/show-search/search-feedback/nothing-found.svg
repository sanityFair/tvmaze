  <linearGradient id="gloss" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F5FBFF" stop-opacity=".08"/><stop offset=".47" stop-color="#F5FBFF" stop-opacity="0"/></linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#CBD5D6" stroke-opacity=".10" stroke-width=".7"/></pattern>
  <clipPath id="screenClip"><rect x="180" y="113" width="368" height="226" rx="11"/></clipPath>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="shadow" x="-25%" y="-40%" width="150%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
  <style>
    .tv-snow { animation: tv-snow 0.48s steps(1, end) infinite; }
    .tv-roll { animation: tv-roll 6s linear infinite; }
    .tv-jitter { animation: tv-jitter 4.2s steps(1, end) infinite; }
    .tv-flicker { animation: tv-flicker 2.6s ease-in-out infinite; }
    @keyframes tv-snow {
      0% { transform: translate(0, 0); } 20% { transform: translate(-37px, -21px); }
      40% { transform: translate(-11px, -63px); } 60% { transform: translate(-59px, -9px); }
      80% { transform: translate(-23px, -47px); }
    }
    @keyframes tv-roll { from { transform: translateY(-70px); } to { transform: translateY(250px); } }
    @keyframes tv-jitter {
      0%, 84%, 100% { transform: none; } 86% { transform: translateX(3px); }
      88% { transform: translateX(-2px); } 90% { transform: translateX(1px); }
    }
    @keyframes tv-flicker { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      .tv-snow, .tv-roll, .tv-jitter, .tv-flicker { animation: none; }
    }
  </style>
  <filter id="tvNoise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85 0.45" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.32"/></feComponentTransfer>
  </filter>
  <linearGradient id="tvRoll" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#DDE6E8" stop-opacity="0"/><stop offset=".5" stop-color="#DDE6E8" stop-opacity=".09"/><stop offset="1" stop-color="#DDE6E8" stop-opacity="0"/>
  </linearGradient>
