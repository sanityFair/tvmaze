  <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62676B"/><stop offset=".2" stop-color="#2D3135"/><stop offset=".78" stop-color="#202326"/><stop offset="1" stop-color="#45494E"/></linearGradient>
  <radialGradient id="screen"><stop stop-color="#293037"/><stop offset=".4" stop-color="#151A1F"/><stop offset="1" stop-color="#080A0E"/></radialGradient>
  <radialGradient id="light"><stop stop-color="#8F9FA0" stop-opacity=".25"/><stop offset=".55" stop-color="#617C86" stop-opacity=".08"/><stop offset="1" stop-color="#657D82" stop-opacity="0"/></radialGradient>
